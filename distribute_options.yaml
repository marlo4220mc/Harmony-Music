output: dist/
releases:
  - name: production
    jobs:
      - name: release-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            enable-experiment: records
      - name: release-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            enable-experiment: records
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            enable-experiment: records
      - name: release-windows-exe
        package:
          platform: windows
          target: exe
      - name: release-dev-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            enable-experiment: records
      - name: release-dev-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            enable-experiment: records