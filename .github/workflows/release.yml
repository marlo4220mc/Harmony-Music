name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.14.0). Leave empty to use pubspec.yaml'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      release_name:
        description: 'Custom release title (e.g. "Harmony Music v1.14.0")'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.24.2'

jobs:
  get-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_source: ${{ steps.resolve.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pubspec version
        id: pubspec
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$PUBSPEC_VERSION" >> $GITHUB_OUTPUT

      - name: Resolve version
        id: resolve
        run: |
          PUBSPEC_VERSION="${{ steps.pubspec.outputs.version }}"
          INPUT_VERSION="${{ inputs.version }}"
          TAG_VERSION=""

          # Extract tag version if triggered by tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
          fi

          # Priority: tag > input > pubspec
          if [[ -n "$TAG_VERSION" ]]; then
            VERSION="$TAG_VERSION"
            SOURCE="tag"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            SOURCE="input"
          else
            VERSION="$PUBSPEC_VERSION"
            SOURCE="pubspec"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (source: $SOURCE)"

      - name: Validate semver format
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

      - name: Validate tag vs pubspec consistency
        if: steps.resolve.outputs.source == 'tag'
        run: |
          TAG_VERSION="${{ steps.resolve.outputs.version }}"
          PUBSPEC_VERSION="${{ steps.pubspec.outputs.version }}"
          if [[ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            echo "Update pubspec.yaml to match the tag before releasing."
            exit 1
          fi
          echo "Tag and pubspec versions match: $TAG_VERSION"

  build-android:
    name: Build Android APKs
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build APK (armeabi-v7a)
        run: |
          flutter build apk --release --target-platform android-arm
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows exe
    needs: get-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install InnoSetup
        run: |
          if (-not (Get-Command "innosetup" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Patch InnoSetup version
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $iss = Get-Content "windows/packaging/exe/inno_setup.iss" -Raw
          $iss = $iss -replace 'AppVersion=.*', "AppVersion=$version"
          $iss = $iss -replace 'OutputBaseFilename=.*', "OutputBaseFilename=harmonymusic-$version-windows-x64"
          Set-Content "windows/packaging/exe/inno_setup.iss" $iss
          Write-Output "InnoSetup patched to $version"

      - name: Build Windows exe
        run: |
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets exe

      - name: Find exe file
        id: find_exe
        run: |
          $exeFile = Get-ChildItem -Path "${{ github.workspace }}/dist" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            echo "exe_path=$($exeFile.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "No .exe files found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ steps.find_exe.outputs.exe_path }}

  build-linux:
    name: Build Linux bundle
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle

  build-deb:
    name: Build deb package
    needs: [get-version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: bundle

      - name: Build deb from bundle
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          FULL_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          mkdir -p pkg/opt/harmonymusic pkg/DEBIAN \
                   pkg/usr/share/applications \
                   pkg/usr/share/icons/hicolor/128x128/apps \
                   pkg/usr/share/icons/hicolor/256x256/apps
          cp -r bundle/. pkg/opt/harmonymusic/
          chmod 755 pkg/opt/harmonymusic/harmonymusic
          sed "s/__VERSION__/${FULL_VERSION}/" linux/packaging/deb/DEBIAN/control > pkg/DEBIAN/control
          cp linux/packaging/deb/DEBIAN/postinst pkg/DEBIAN/postinst
          cp linux/packaging/deb/DEBIAN/postrm pkg/DEBIAN/postrm
          chmod +x pkg/DEBIAN/postinst pkg/DEBIAN/postrm
          cp linux/packaging/deb/usr/share/applications/harmonymusic.desktop pkg/usr/share/applications/harmonymusic.desktop
          cp assets/icons/icon.png pkg/usr/share/icons/hicolor/128x128/apps/harmonymusic.png
          cp assets/icons/icon.png pkg/usr/share/icons/hicolor/256x256/apps/harmonymusic.png
          dpkg-deb --build --root-owner-group pkg "harmonymusic-${VERSION}.deb"
          dpkg-deb --info "harmonymusic-${VERSION}.deb"
          dpkg-deb -c "harmonymusic-${VERSION}.deb" | grep 'opt/harmonymusic/harmonymusic$'
          DEPS="$(dpkg-deb -f "harmonymusic-${VERSION}.deb" Depends)"
          echo "Depends: ${DEPS}"
          echo "$DEPS" | grep -q "libmpv" || { echo "::error::libmpv missing in Depends"; exit 1; }
          # libayatana-appindicator3-1 MUST be a direct dependency, not the
          # libappindicator3-1 | libayatana-appindicator3-1 alternative. The old
          # libappindicator3-1 only ships libappindicator3.so.1 (not the Ayatana
          # soname the app actually loads) and Conflicts/Replaces with the Ayatana
          # package, so apt could pick it and leave the app unable to find
          # libayatana-appindicator3.so.1.
          echo "$DEPS" | grep -q "libayatana-appindicator3-1" || { echo "::error::libayatana-appindicator3-1 missing in Depends"; exit 1; }
          if echo "$DEPS" | grep -q 'libappindicator3-1[[:space:]]*|'; then
            echo "::error::libappindicator3-1 must not precede libayatana-appindicator3-1 as an alternative; it lacks the Ayatana soname and conflicts with it"
            exit 1
          fi
          if echo "$DEPS" | grep -qE "(^|, )(mpv)(,|$)"; then
            echo "::error::the mpv executable must not be a Depends entry"
            exit 1
          fi
          echo "deb Depends OK: libmpv and libayatana-appindicator3-1 (no mpv)"


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: harmonymusic-*.deb

  build-rpm:
    name: Build rpm package
    needs: [get-version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: bundle

      - name: Build rpm from bundle
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          sudo apt-get update
          sudo apt-get install -y rpm patchelf
          mkdir -p "$PWD/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          BUILDROOT="$PWD/rpmbuild/BUILD/harmonymusic"
          mkdir -p "$BUILDROOT"
          cp -r bundle/. "$BUILDROOT/"
          for f in "$BUILDROOT"/lib/*.so; do
            [ -f "$f" ] || continue
            rp="$(patchelf --print-rpath "$f" 2>/dev/null)" || continue
            sane="$(echo "$rp" | awk -F: '{s=""; for(i=1;i<=NF;i++){if(substr($i,1,1)=="/") $i="$ORIGIN"; if(s!="") s=s ":"; s=s $i} print s}')"
            [ "$sane" != "$rp" ] && patchelf --set-rpath "$sane" "$f" || true
          done
          chmod 755 "$BUILDROOT/harmonymusic"
          cp assets/icons/icon.png "$PWD/rpmbuild/BUILD/harmonymusic.png"
          cp linux/packaging/rpm/harmonymusic.desktop "$PWD/rpmbuild/BUILD/harmonymusic.desktop"
          sed "s/__VERSION__/${VERSION}/g" linux/packaging/rpm/harmonymusic.spec > rpmbuild/SPECS/harmonymusic.spec
          QA_RPATHS=17 rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/harmonymusic.spec
          cp "$PWD"/rpmbuild/RPMS/x86_64/harmonymusic-*.rpm "harmonymusic-${VERSION}.rpm"
          rpm -qplv "harmonymusic-${VERSION}.rpm" | grep '/usr/share/harmonymusic/harmonymusic$'
          rpm -qp --requires "harmonymusic-${VERSION}.rpm" > requires.txt
          cat requires.txt
          grep -q "mpv-libs" requires.txt || { echo "::error::mpv-libs missing in Requires"; exit 1; }
          grep -q "libayatana-appindicator-gtk3" requires.txt || { echo "::error::libayatana-appindicator-gtk3 missing in Requires"; exit 1; }
          echo "rpm Requires OK: mpv-libs and libayatana-appindicator-gtk3"; rm requires.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: harmonymusic-*.rpm

  build-arch:
    name: Build Arch package
    needs: [get-version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: bundle

      - name: Build Arch package (makepkg)
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p archbuild
          tar -C bundle -czf "archbuild/harmonymusic-${VERSION}-linux-x86_64.tar.gz" .
          sed "s/__PKGVER__/${VERSION}/g" linux/packaging/arch/PKGBUILD > archbuild/PKGBUILD
          cp linux/packaging/arch/harmonymusic.desktop archbuild/harmonymusic.desktop
          cp assets/icons/icon.png archbuild/harmonymusic.png
          chmod -R a+rX archbuild
          docker run --rm -v "$PWD/archbuild":/work -w /work archlinux:latest bash -c '
            # jack2 is installed explicitly so the `jack` provider dependency of
            # mpv is already satisfied, avoiding pacman'"'"'s interactive provider
            # prompt in a non-TTY job. libayatana-indicator is installed
            # explicitly too (it is a hard dependency of libayatana-appindicator
            # and is declared in the PKGBUILD).
            set -e
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed \
              base-devel gtk3 libayatana-appindicator libayatana-indicator jack2 mpv
            useradd -m builder
            chown -R builder /work
            su builder -c "makepkg -f --noconfirm"
            PKG=$(ls harmonymusic-*.pkg.tar.zst)
            echo "Built package: $PKG"
            tar -tvf "$PKG" | grep "usr/share/harmonymusic/harmonymusic$"
            tar -tvf "$PKG" | grep "usr/share/harmonymusic/harmonymusic$" | awk "{print \$1}" | grep -q -- "-rwxr-xr-x"
            echo "harmonymusic binary is executable (755) in package"
            tar -xOf "$PKG" .PKGINFO > /tmp/PKGINFO
            for d in gtk3 libayatana-appindicator libayatana-indicator mpv; do
              grep -qx "depend = $d" /tmp/PKGINFO || { echo "::error::depend $d missing in .PKGINFO"; exit 1; }
            done
            echo "PKGINFO depends OK: gtk3 libayatana-appindicator libayatana-indicator mpv"
          '
          sudo chown -R "$(id -u):$(id -g)" archbuild 2>/dev/null || true
          cp archbuild/harmonymusic-*.pkg.tar.zst "harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst"
          ls -la harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: harmonymusic-*-linux-arch-x86_64.pkg.tar.zst

  create-release:
    name: Create GitHub Release
    needs: [get-version, build-android, build-windows, build-linux, build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p release

          # Android
          cp artifacts/android-apks/app-arm64-v8a-release.apk "release/harmonymusic-${VERSION}-android-arm64-v8a.apk" 2>/dev/null || true
          cp artifacts/android-apks/app-armeabi-v7a-release.apk "release/harmonymusic-${VERSION}-android-armeabi-v7a.apk" 2>/dev/null || true
          cp artifacts/android-apks/app-release.apk "release/harmonymusic-${VERSION}-android-universal.apk" 2>/dev/null || true

          # Windows
          cp artifacts/windows-exe/*.exe "release/harmonymusic-${VERSION}-windows-x64.exe" 2>/dev/null || true

          # Linux
          find artifacts/linux-deb -name "*.deb" -exec cp {} "release/harmonymusic-${VERSION}-linux-x86_64.deb" \; 2>/dev/null || true
          find artifacts/linux-rpm -name "*.rpm" -exec cp {} "release/harmonymusic-${VERSION}-linux-x86_64.rpm" \; 2>/dev/null || true
          find artifacts/linux-arch -name "*.pkg.tar.zst" -exec cp {} "release/harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst" \; 2>/dev/null || true

          echo "Release files:"
          ls -la release/

      - name: Generate release notes body
        id: notes
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"

          # Changelog block for this version
          awk -v v="$VERSION" '
            $0 == "# " v { found=1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog_block.txt

          # Previous version (first version header below current)
          PREV_VERSION=$(awk -v v="$VERSION" '
            $0 == "# " v { found=1; next }
            found && /^# [0-9]+\.[0-9]+\.[0-9]+/ { print $2; exit }
          ' CHANGELOG.md)
          PREV_VERSION="${PREV_VERSION:-1.0.0}"

          # Contributors from git range if previous version tag exists
          if git rev-parse -q --verify "refs/tags/v${PREV_VERSION}" >/dev/null 2>&1; then
            CONTRIBUTORS=$(git log --format='%an' "v${PREV_VERSION}..HEAD" | sort -u | awk '{print "[@"$1"](https://github.com/"$1")"}' | paste -sd ', ' -)
          else
            CONTRIBUTORS="[@marlo4220mc](https://github.com/marlo4220mc)"
          fi

          REPO="https://github.com/marlo4220mc/Harmony-Music"

          cat > /tmp/release_body.md <<EOF
          # Harmony Music V${VERSION}

          ## Thank you all for showing immense love and support ❤️.

          # Changelogs:

          $(cat /tmp/changelog_block.txt)

          **Full Changelog**: [v${PREV_VERSION}...v${VERSION}](${REPO}/compare/v${PREV_VERSION}...v${VERSION})

          ## Thanks to all contributors:

          ${CONTRIBUTORS}

          # Android

          ### Download apk from below assets as per your device architecture.

          - harmonymusic-${VERSION}-android-arm64-v8a.apk - for Arm64 64bit processor architecture (Support New devices)
          - harmonymusic-${VERSION}-android-armeabi-v7a.apk - for Armabi 32bit processor architecture (Support Old devices)
          - harmonymusic-${VERSION}-android-universal.apk - universal apk

          # Windows (64 bit)

          - harmonymusic-${VERSION}-windows-x64.exe

          #### ⚠️ Attention before downloading exe file please note that some VirusTotal vendors are flagging this binary as Malicious report. Please don't raise any issues as i'm not gonna look into this and fix this (i've no idea how native windows works). For your own satisfaction you can build it by yourself or Git Action check [here](${REPO}/wiki/Build-Harmony-music-App-by-yourself).

          # Linux (Debian, RPM, Arch)

          - harmonymusic-${VERSION}-linux-x86_64.deb
          - harmonymusic-${VERSION}-linux-x86_64.rpm
          - harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst

          ### Arch / CachyOS
          \`curl -LO ${REPO}/releases/download/v${VERSION}/harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst\`
          \`sudo pacman -U harmonymusic-${VERSION}-linux-arch-x86_64.pkg.tar.zst\`

          ## Install MPV package in linux if any of binaries is not working

          **For Debian:**
          \`sudo apt install mpv\`

          **For Arch linux:**
          \`sudo pacman -S mpv\`

          **For Red hat:**
          \`sudo dnf install mpv-libs\`

          ## Linux: Fedora 44 - Google Fonts failing with TLS errors

          On Fedora 44, after a \`dnf update\`, Google Fonts may fail to load inside the app with errors like \`CERTIFICATE_VERIFY_FAILED: unable to get local issuer certificate\`. This is a certificate-path quirk between Fedora 44 and the Google Fonts HTTP client bundled in Flutter 3.24.2, not a bug in Harmony Music.

          Restore the expected CA bundle locations manually:

          \`\`\`sh
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -sf /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/pki/tls/certs/ca-bundle.crt
          sudo ln -sf /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/certs/ca-certificates.crt
          \`\`\`

          > Note: Harmony Music never modifies \`/etc\` on its own. The commands above are an optional user-side workaround for the affected Fedora 44 + Flutter 3.24.2 combination.

          How to import playlist,song,album,artist from yt/ytmusic? check [FAQ](${REPO}/wiki/FAQ)
          Want to know about how to link with Piped check [WIKI](${REPO}/wiki/Piped-linking)
          EOF
          echo "Release body generated ($(wc -l < /tmp/release_body.md) lines)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', needs.get-version.outputs.version) }}
          name: ${{ inputs.release_name || format('Harmony Music v{0}', needs.get-version.outputs.version) }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          body_path: /tmp/release_body.md
          files: release/*
